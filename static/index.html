<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cộng số nguyên rất lớn</title>
<style>
    :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-alt: #f8faff;
        --border: #dfe7f3;
        --text: #1f2937;
        --muted: #64748b;
        --primary: #2f6fed;
        --primary-soft: #eef4ff;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --danger-text: #b91c1c;
        --log-bg: #0f172a;
        --log-text: #dceafe;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 28px 16px;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 24px;
    }

    .page-header {
        margin-bottom: 20px;
    }

    h1 {
        font-size: clamp(24px, 2vw, 32px);
        margin: 0 0 8px;
    }

    .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
    }

    .workspace {
        display: grid;
        grid-template-columns: minmax(290px, 0.95fr) minmax(360px, 1.45fr);
        gap: 20px;
        align-items: start;
    }

    .panel {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
    }

    .panel h3 {
        margin: 0 0 14px;
        font-size: 15px;
        color: var(--muted);
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        font: 16px Consolas, monospace;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        margin-bottom: 18px;
        transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus {
        outline: none;
        border-color: rgba(47, 111, 237, 0.45);
        box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
    }

    button {
        background: var(--primary);
        color: #fff;
        border: 0;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        transition: opacity .15s ease, transform .15s ease;
    }

    button:hover:not(:disabled) {
        opacity: 0.96;
        transform: translateY(-1px);
    }

    button:disabled {
        background: #a9b6cc;
        cursor: not-allowed;
    }

    .error {
        margin-top: 16px;
        color: var(--danger-text);
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        padding: 12px 14px;
        border-radius: 10px;
        line-height: 1.5;
    }

    .result-panel {
        min-height: 100%;
    }

    .result {
        font: 700 26px/1.5 Consolas, monospace;
        word-break: break-all;
        overflow-wrap: anywhere;
        background: var(--primary-soft);
        color: #1f52c4;
        padding: 14px 16px;
        border-radius: 10px;
        border: 1px solid #dfe9ff;
        min-height: 72px;
        display: flex;
        align-items: center;
    }

    .log {
        background: var(--log-bg);
        color: var(--log-text);
        font: 13px/1.6 Consolas, monospace;
        padding: 16px;
        border-radius: 10px;
        min-height: 280px;
        max-height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
        .workspace {
            grid-template-columns: 1fr;
        }

        .container {
            padding: 18px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>➕ Cộng hai số nguyên lớn</h1>
        <p class="subtitle">Thực hiện phép cộng theo cách cộng từng chữ số từ phải sang trái.</p>
    </div>

    <div class="workspace">
        <div class="panel">
            <form id="form">
                <div>
                    <label for="num1">Số thứ nhất</label>
                    <input id="num1" placeholder="Ví dụ: 123456789012345678901234567890" autocomplete="off">
                </div>

                <div>
                    <label for="num2">Số thứ hai</label>
                    <input id="num2" placeholder="Ví dụ: 987654321098765432109876543210" autocomplete="off">
                </div>

                <button id="btn" type="submit">Tính</button>
            </form>

            <div class="error hidden" id="error"></div>
        </div>

        <div class="panel result-panel">
            <div id="output" class="hidden">
                <h3>Kết quả</h3>
                <div class="result" id="result"></div>
                <h3>Log từng bước tính</h3>
                <div class="log" id="log"></div>
            </div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

function kiemTra(value, ten) {
    if (!value.trim()) return `${ten}: không được để trống.`;
    const sai = value.search(/\D/);
    if (sai !== -1) return `${ten}: ký tự "${value[sai]}" ở vị trí ${sai + 1} không hợp lệ. Chỉ được nhập các chữ số 0-9.`;
}

$('form').onsubmit = async e => {
    e.preventDefault();
    $('error').classList.add('hidden');
    $('error').hidden = true;
    $('output').classList.add('hidden');
    $('output').hidden = true;

    const num1 = $('num1').value, num2 = $('num2').value;
    const loi = kiemTra(num1, 'Số thứ nhất') || kiemTra(num2, 'Số thứ hai');
    if (loi) return showError(loi);

    $('btn').disabled = true;
    try {
        const res = await fetch('/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ num1, num2 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Có lỗi xảy ra');

        $('result').textContent = data.result;
        $('log').textContent = data.log.map(line => '› ' + line).join('\n');
        $('output').classList.remove('hidden');
        $('output').hidden = false;
    } catch (err) {
        showError(err.message);
    } finally {
        $('btn').disabled = false;
    }
};

function showError(msg) {
    $('error').textContent = msg;
    $('error').classList.remove('hidden');
    $('error').hidden = false;
}
</script>
</body>
</html>
