<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cộng số nguyên rất lớn</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; margin: 0; padding: 40px 16px; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #e2e5eb; border-radius: 12px; padding: 24px; }
    h1 { font-size: 22px; margin-top: 0; }
    .subtitle { color: #6b7280; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font: 16px Consolas, monospace; border: 1px solid #e2e5eb; border-radius: 8px; margin-bottom: 18px; }
    button { background: #2f6fed; color: #fff; border: 0; padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #a9b6cc; cursor: not-allowed; }
    .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 8px; margin-top: 14px; }
    .result { font: 700 26px Consolas, monospace; word-break: break-all; background: #eef4ff; color: #1f52c4; padding: 14px; border-radius: 8px; }
    .log { background: #0f172a; color: #d1e7ff; font: 13px/1.6 Consolas, monospace; padding: 16px; border-radius: 8px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
    h3 { font-size: 13px; color: #6b7280; margin: 20px 0 8px; }
</style>
</head>
<body>
<div class="container">
    <h1>➕ Cộng hai số nguyên lớn</h1>
    <p class="subtitle">Thực hiện phép cộng theo cách cộng từng chữ số từ phải sang trái.</p>

    <form id="form">
        <label for="num1">Số thứ nhất</label>
        <input id="num1" placeholder="Ví dụ: 123456789012345678901234567890" autocomplete="off">

        <label for="num2">Số thứ hai</label>
        <input id="num2" placeholder="Ví dụ: 987654321098765432109876543210" autocomplete="off">

        <button id="btn">Tính</button>
    </form>

    <div class="error" id="error" hidden></div>

    <div id="output" hidden>
        <h3>Kết quả</h3>
        <div class="result" id="result"></div>
        <h3>Log từng bước tính</h3>
        <div class="log" id="log"></div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

function kiemTra(value, ten) {
    if (!value.trim()) return `${ten}: không được để trống.`;
    const sai = value.search(/\D/);
    if (sai !== -1) return `${ten}: ký tự "${value[sai]}" ở vị trí ${sai + 1} không hợp lệ. Chỉ được nhập các chữ số 0-9.`;
}

$('form').onsubmit = async e => {
    e.preventDefault();
    $('error').hidden = $('output').hidden = true;

    const num1 = $('num1').value, num2 = $('num2').value;
    const loi = kiemTra(num1, 'Số thứ nhất') || kiemTra(num2, 'Số thứ hai');
    if (loi) return showError(loi);

    $('btn').disabled = true;
    try {
        const res = await fetch('/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ num1, num2 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Có lỗi xảy ra');

        $('result').textContent = data.result;
        $('log').textContent = data.log.map(line => '› ' + line).join('\n');
        $('output').hidden = false;
    } catch (err) {
        showError(err.message);
    } finally {
        $('btn').disabled = false;
    }
};

function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = false;
}
</script>
</body>
</html>
